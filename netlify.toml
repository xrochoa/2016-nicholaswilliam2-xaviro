[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  # Force devDependencies to be installed (gulp, babel, etc. live there).
  # Do NOT set NODE_ENV=production here: npm would skip devDependencies.
  NPM_CONFIG_PRODUCTION = "false"

# Preserve the original /savetoken endpoint name by rewriting it to the
# equivalent Netlify Function. This keeps the client-side code identical
# to the 2016 implementation.
[[redirects]]
  from = "/savetoken"
  to = "/.netlify/functions/savetoken"
  status = 200

# SPA fallback for react-router browserHistory
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
